# Traefik en este VPS usa network_mode: host: no se puede
# `docker network connect`. Publicamos la app en 127.0.0.1:3010
# (el 3000 ya lo tiene agent-platform-admin).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -sI http://127.0.0.1:3010

name: novalup-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novalup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novalup}
      POSTGRES_DB: ${POSTGRES_DB:-novalup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novalup} -d ${POSTGRES_DB:-novalup}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      internal:
        aliases:
          - postgres

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novalup}:${POSTGRES_PASSWORD:-novalup}@postgres:5432/${POSTGRES_DB:-novalup}?connect_timeout=30
      UPLOAD_DIR: /data/uploads
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.novalup-cpanel.rule=Host(`cpanel.novaluptech.com`)
      - traefik.http.routers.novalup-cpanel.entrypoints=websecure
      - traefik.http.routers.novalup-cpanel.tls=true
      - traefik.http.routers.novalup-cpanel.tls.certresolver=letsencrypt
      - traefik.http.routers.novalup-cpanel.service=novalup-cpanel
      - traefik.http.services.novalup-cpanel.loadbalancer.server.port=3000

networks:
  internal:
    name: novalup-internal

volumes:
  pgdata:
  uploads:
