name: CI/CD

# Secrets requeridos en GitHub > Settings > Secrets and variables > Actions:
#   VPS_HOST    -> IP o dominio del VPS (ej: 167.86.123.45)
#   VPS_USER    -> usuario SSH (ej: root o deploy)
#   VPS_SSH_KEY -> clave privada SSH (cat ~/.ssh/id_ed25519) - sin passphrase recomendado
#   VPS_PORT    -> puerto SSH (opcional, default 22)
#
# En el VPS debe existir:
#   /opt/novaluptech-cpanel/  -> git clone https://github.com/mlupani/novaluptech-cpanel.git /opt/novaluptech-cpanel
#   /opt/novaluptech-cpanel/.env -> con POSTGRES_*, AUTH_*, DATABASE_URL, etc. (no está en git)
#   docker + docker compose plugin instalados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Dummy URL solo para que `next build` / `prisma generate` no fallen en CI
  DATABASE_URL: postgresql://novalup:novalup@localhost:5432/novalup

jobs:
  ci:
    name: Lint & Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Verificar build (Prisma + Next.js)
        run: |
          pnpm prisma generate
          pnpm exec next build
        env:
          AUTH_SECRET: dummy_secret_for_ci_only
          AUTH_USER: dummy
          AUTH_PASSWORD: dummy

  deploy:
    name: Deploy VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cpanel.novaluptech.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Actualizar app en el VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: /opt/novaluptech-cpanel
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          envs: GH_TOKEN,GH_REPO,DEPLOY_SHA,DEPLOY_PATH
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            cd "$DEPLOY_PATH"

            if [[ ! -f docker-compose.prod.yml ]]; then
              echo "No se encontró docker-compose.prod.yml en $DEPLOY_PATH"
              exit 1
            fi

            if [[ ! -f .env ]]; then
              echo "Falta el archivo .env en $DEPLOY_PATH (no está en git; hay que crearlo en el VPS)"
              exit 1
            fi

            command -v git >/dev/null || { echo "git no está instalado"; exit 1; }
            command -v docker >/dev/null || { echo "docker no está instalado"; exit 1; }
            docker compose version >/dev/null || { echo "docker compose no está disponible"; exit 1; }

            echo "Actualizando código a $DEPLOY_SHA..."
            git fetch --depth=50 "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$DEPLOY_SHA"
            git reset --hard FETCH_HEAD

            echo "Reconstruyendo e iniciando contenedores..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "Limpiando imágenes huérfanas..."
            docker image prune -f

            echo "Esperando a que la app responda en 127.0.0.1:3010..."
            ready=0
            for i in $(seq 1 40); do
              if curl -sf -o /dev/null http://127.0.0.1:3010; then
                ready=1
                echo "App respondiendo (intento $i)"
                break
              fi
              echo "  intento $i/40..."
              sleep 3
            done

            if [[ "$ready" -ne 1 ]]; then
              echo "Health check falló. Últimos logs de app:"
              docker compose -f docker-compose.prod.yml logs --tail 120 app
              exit 1
            fi

            docker compose -f docker-compose.prod.yml ps
            echo "Deploy completado: $DEPLOY_SHA"
