# Traefik en este VPS usa network_mode: host: no se puede
# `docker network connect`. Publicamos la app en 127.0.0.1:3010
# (el 3000 ya lo tiene agent-platform-admin).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -sI http://127.0.0.1:3010

name: novalup-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novalup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novalup}
      POSTGRES_DB: ${POSTGRES_DB:-novalup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novalup} -d ${POSTGRES_DB:-novalup}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      internal:
        aliases:
          - postgres

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novalup}:${POSTGRES_PASSWORD:-novalup}@postgres:5432/${POSTGRES_DB:-novalup}?connect_timeout=30
      UPLOAD_DIR: /data/uploads
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.novalup.rule=Host(`${TRAEFIK_HOST:-cpanel.novaluptech.com}`)
      - traefik.http.routers.novalup.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.novalup.tls=true
      - traefik.http.routers.novalup.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.novalup.service=novalup
      # Traefik está en network_mode: host: no alcanza el IP de Docker.
      # El admin usa el mismo truco (127.0.0.1:3000). El 3000 ya está ocupado.
      - "traefik.http.services.novalup.loadbalancer.servers[0].url=http://127.0.0.1:3010"

networks:
  internal:
    name: novalup-internal

volumes:
  pgdata:
  uploads:
